type: diff_cbf_gnn
robot_type: ${robot.type}
history_len: 3
obs_frame_dim: ${add:6,${mul:${env.humans.num_humans},6}}
obs_dim: ${mul:${model.history_len},${model.obs_frame_dim}}

actor:
  # Policy network and exploration
  hidden_dim: 256
  control_hidden_dim: 256
  scalar_hidden_dim: 256
  act: relu
  action_std_init: 0.5

  # CBF safety model (BarrierNet style)  # [CBF]
  # R_i = robot.radius + human.radius + margin_base (fixed). kappa_i learned per obstacle.
  margin_base: ${env.safety_margin}
  learn_kappa: true
  kappa_min: 0.5
  kappa_max: 5.0     # keep well below 1/dt = 10 so one step cannot cross the boundary
  kappa_init: 2.0    # equals diff_cvar_gnn's fixed alpha at initialisation
  lookahead_distance: 0.2

  # Differentiable QP solver, reward, and diagnostics
  qp_verbose: -1
  qp_max_iter: 40
  qp_eps: 1e-12
  qp_not_improved_lim: 3
  qp_check_q_spd: false
  qp_slack_weight: 10.0
  qp_residual_reward_weight: 0.05
  qp_full_diagnostics: false
  qp_obs_top_k: 5

  # Shared GNN encoder
  coordinate_frame: robot_body
  gnn_hidden_dim: 64
  gnn_latent_dim: 16
  gnn_layers: ${model.history_len}

  # Input feature scaling
  position_scale: ${env.farthest_dist}
  velocity_scale: ${robot.v_max}

critic:
  hidden_dim: 256
  hidden_dim2: 256
  act: relu