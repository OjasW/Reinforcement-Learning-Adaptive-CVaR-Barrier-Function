type: diff_cvar_cnn
robot_type: ${robot.type}

# Vector history: the QP uses the current frame (top-k humans), the optional state critic uses all frames.
# The CNN never sees it.
history_len: 3
obs_frame_dim: ${add:6,${mul:${env.humans.num_humans},6}}
obs_dim: ${mul:${model.history_len},${model.obs_frame_dim}}

# [IMG] Image input (env/jax_image_renderer.py). This block turns on image rendering in the trainer.
image_history_len: 4          # latest 3 or 4 frames, stacked on channels -> 3 * 4 = 12 input channels
render:
  image_size: 84              # H = W
  half_extent: 4.0            # metres from centre to edge -> 8 x 8 m window, 0.095 m/px
  view: egocentric            # robot centred, heading up
  goal_radius: 0.3
  goal_clip_to_border: true
  heading_tick: true
  tick_width_px: 2.0

actor:
  # Policy network and exploration
  hidden_dim: 256
  control_hidden_dim: 256
  scalar_hidden_dim: 256
  act: relu
  action_std_init: 0.5

  # [IMG] CNN trunk (same as ppo_cnn): 84 -> 20 -> 9 -> 7
  cnn:
    channels: [32, 64, 64]
    kernels: [8, 4, 3]
    strides: [4, 2, 1]
    latent_dim: 512

  # [IMG] Per-human beta / r_safe heads on the QP top-k humans
  #   image_state: [image latent, human body-frame state (rel pos, rel vel, radius)]
  #   image:       [image latent] only -> same beta and r_safe for every human (pixels-only network)
  risk_head_input: image_state
  coordinate_frame: robot_body
  position_scale: ${env.farthest_dist}    # scaling of the human state features
  velocity_scale: ${robot.v_max}

  # CVaR-CBF safety model (same as diff_cvar_mlp / diff_cvar_gnn)
  margin_base: ${env.safety_margin}
  margin_extra_max: ${add:${mul:1.5,${robot.radius}},${mul:1.5,${env.humans.radius}},${mul:1.5,${env.safety_margin}}}
  alpha: 2.0
  beta_min: 0.05
  beta: 0.5  # Total risk budget across active QP top-k humans
  lookahead_distance: 0.2

  # Differentiable QP solver, reward, and diagnostics
  qp_verbose: -1
  qp_max_iter: 40
  qp_eps: 1e-12
  qp_not_improved_lim: 3
  qp_check_q_spd: false
  qp_slack_weight: 10.0
  qp_residual_reward_weight: 0.05
  qp_full_diagnostics: false
  qp_obs_top_k: 5

  # Human-motion GMM predictor
  gmm_weights: [0.6, 0.2, 0.2]
  gmm_stds: [0.1, 0.2, 0.2]
  gmm_lateral_ratio: 0.3

critic:
  input: image                # image: shares the CNN trunk | state: asymmetric critic on ppo_mlp features
  hidden_dim: 256
  hidden_dim2: 256
  act: relu
  # used only when input: state (same encoder sizes and scaling as ppo_mlp)
  encoder_hidden_dim: 64
  encoder_latent_dim: 16
  encoder_layers: 3
  position_scale: ${env.farthest_dist}
  velocity_scale: ${robot.v_max}
